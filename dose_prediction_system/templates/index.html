<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>头颈部放疗剂量预测</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="">
  <main class="container">
    <section class="card">
      <h1>头颈部放疗剂量预测</h1>
      <div class="stats">
        <div class="stat"><span>训练集</span><strong>200</strong></div>
        <div class="stat"><span>验证集</span><strong>40</strong></div>
        <div class="stat"><span>测试集</span><strong>100</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>开始预测</h2>

      <div class="form-section">
        <h3>使用内置病例</h3>
        <form id="inference-form" class="form-grid" action="/run-inference" method="post">
          <label>数据划分
            <select id="split-select" name="split">
              <option value="train">训练集</option>
              <option value="validation" selected>验证集</option>
              <option value="test">测试集</option>
            </select>
          </label>
          <label>病例编号
            <select id="patient-select" name="patient_id"></select>
          </label>
          <label>模型检查点
            <select id="checkpoint-select" name="checkpoint_path" >
              
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/deploy_epoch_200.pt">deploy_epoch_200.pt（部署用）</option>
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/last.pt">last.pt锛堟渶鏂拌缁冨畬鎴愶級</option>
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/best.pt">best.pt（最佳）</option>
                
              
            </select>
          </label>
          <button id="submit-button" type="submit" class="btn-primary" >开始预测</button>
        </form>
      </div>

      <div class="form-divider"></div>

      <div class="form-section">
        <h3>导入同格式病例包</h3>
        <form id="upload-form" class="form-grid" enctype="multipart/form-data">
          <label>病例压缩包
            <input id="case-zip-input" type="file" name="case_zip" accept=".zip,application/zip">
          </label>
          <label>模型检查点
            <select id="upload-checkpoint-select" name="checkpoint_path" >
              
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/deploy_epoch_200.pt">deploy_epoch_200.pt（部署用）</option>
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/last.pt">last.pt锛堟渶鏂拌缁冨畬鎴愶級</option>
                
                <option value="/home/ubuntu/yujingxing/dose_prediction_system/outputs/checkpoints/best.pt">best.pt（最佳）</option>
                
              
            </select>
          </label>
          <button id="upload-submit-button" type="submit" class="btn-primary" >上传并预测</button>
        </form>
      </div>

      <div id="progress-section" class="progress-section is-hidden" aria-live="polite">
        <div class="progress-head">
          <strong id="progress-title">正在预测</strong>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-message" class="hint">任务提交后，这里会显示实时进度。</p>
      </div>

      <p id="form-error" class="warning is-hidden"></p>

      
    </section>

    <section class="card">
      <h2>病例</h2>
      <p class="hint">点击编号后，会自动填入上方表单。</p>
      <div id="patient-grid" class="patient-grid"></div>
    </section>

    <section id="results-section" class="card is-hidden">
      <div class="top-row">
        <h2>预测结果</h2>
        <a id="result-link" href="#" class="link-button is-hidden">单独打开结果页</a>
      </div>

      <div id="result-header" class="result-header"></div>
      <div id="result-stats" class="stats"></div>

      <div id="slice-panel" class="result-block is-hidden">
        <h3>轴向剂量叠加查看</h3>
        <div class="slice-controls">
          <input id="slice-slider" type="range" min="0" max="0" value="0">
          <span id="slice-label">第 1 张 / 共 1 张</span>
        </div>
        <div id="viewer-grid" class="viewer-grid single">
          <figure>
            <figcaption>预测剂量叠加在 CT 上</figcaption>
            <img id="pred-image" class="slice-image" alt="预测剂量叠加图">
          </figure>
          <figure id="ref-figure">
            <figcaption>参考剂量叠加在 CT 上</figcaption>
            <img id="ref-image" class="slice-image" alt="参考剂量叠加图">
          </figure>
        </div>
      </div>

      <div id="dvh-panel" class="result-block is-hidden">
        <h3>DVH 曲线</h3>
        <div id="dvh-controls" class="chart-controls">
          <label>结构名称
            <select id="structure-select"></select>
          </label>
        </div>
        <div id="dvh-chart-wrap" class="chart-wrap">
          <canvas id="dvh-chart"></canvas>
        </div>
        <p id="dvh-empty" class="hint is-hidden">该病例暂无可显示的 DVH 曲线。</p>
      </div>

      <div id="metric-panel" class="result-block is-hidden">
        <h3>DVH 指标</h3>
        <div class="table-wrap">
          <table class="metric-table">
            <thead>
              <tr>
                <th>结构</th>
                <th>指标</th>
                <th>预测值</th>
                <th>参考值</th>
                <th>绝对差值</th>
              </tr>
            </thead>
            <tbody id="metric-body"></tbody>
          </table>
        </div>
        <p id="metric-empty" class="hint is-hidden">当前没有参考剂量，因此无法显示对照指标。</p>
      </div>
    </section>
  </main>

  <script>
    const splitLabels = {
      train: "训练集",
      validation: "验证集",
      test: "测试集",
      upload: "导入病例",
    };
    const patientsBySplit = {"train": ["pt_1", "pt_2", "pt_3", "pt_4", "pt_5", "pt_6", "pt_7", "pt_8", "pt_9", "pt_10", "pt_11", "pt_12", "pt_13", "pt_14", "pt_15", "pt_16", "pt_17", "pt_18", "pt_19", "pt_20", "pt_21", "pt_22", "pt_23", "pt_24", "pt_25", "pt_26", "pt_27", "pt_28", "pt_29", "pt_30", "pt_31", "pt_32", "pt_33", "pt_34", "pt_35", "pt_36", "pt_37", "pt_38", "pt_39", "pt_40", "pt_41", "pt_42", "pt_43", "pt_44", "pt_45", "pt_46", "pt_47", "pt_48", "pt_49", "pt_50", "pt_51", "pt_52", "pt_53", "pt_54", "pt_55", "pt_56", "pt_57", "pt_58", "pt_59", "pt_60", "pt_61", "pt_62", "pt_63", "pt_64", "pt_65", "pt_66", "pt_67", "pt_68", "pt_69", "pt_70", "pt_71", "pt_72", "pt_73", "pt_74", "pt_75", "pt_76", "pt_77", "pt_78", "pt_79", "pt_80", "pt_81", "pt_82", "pt_83", "pt_84", "pt_85", "pt_86", "pt_87", "pt_88", "pt_89", "pt_90", "pt_91", "pt_92", "pt_93", "pt_94", "pt_95", "pt_96", "pt_97", "pt_98", "pt_99", "pt_100", "pt_101", "pt_102", "pt_103", "pt_104", "pt_105", "pt_106", "pt_107", "pt_108", "pt_109", "pt_110", "pt_111", "pt_112", "pt_113", "pt_114", "pt_115", "pt_116", "pt_117", "pt_118", "pt_119", "pt_120", "pt_121", "pt_122", "pt_123", "pt_124", "pt_125", "pt_126", "pt_127", "pt_128", "pt_129", "pt_130", "pt_131", "pt_132", "pt_133", "pt_134", "pt_135", "pt_136", "pt_137", "pt_138", "pt_139", "pt_140", "pt_141", "pt_142", "pt_143", "pt_144", "pt_145", "pt_146", "pt_147", "pt_148", "pt_149", "pt_150", "pt_151", "pt_152", "pt_153", "pt_154", "pt_155", "pt_156", "pt_157", "pt_158", "pt_159", "pt_160", "pt_161", "pt_162", "pt_163", "pt_164", "pt_165", "pt_166", "pt_167", "pt_168", "pt_169", "pt_170", "pt_171", "pt_172", "pt_173", "pt_174", "pt_175", "pt_176", "pt_177", "pt_178", "pt_179", "pt_180", "pt_181", "pt_182", "pt_183", "pt_184", "pt_185", "pt_186", "pt_187", "pt_188", "pt_189", "pt_190", "pt_191", "pt_192", "pt_193", "pt_194", "pt_195", "pt_196", "pt_197", "pt_198", "pt_199", "pt_200"], "validation": ["pt_201", "pt_202", "pt_203", "pt_204", "pt_205", "pt_206", "pt_207", "pt_208", "pt_209", "pt_210", "pt_211", "pt_212", "pt_213", "pt_214", "pt_215", "pt_216", "pt_217", "pt_218", "pt_219", "pt_220", "pt_221", "pt_222", "pt_223", "pt_224", "pt_225", "pt_226", "pt_227", "pt_228", "pt_229", "pt_230", "pt_231", "pt_232", "pt_233", "pt_234", "pt_235", "pt_236", "pt_237", "pt_238", "pt_239", "pt_240"], "test": ["pt_241", "pt_242", "pt_243", "pt_244", "pt_245", "pt_246", "pt_247", "pt_248", "pt_249", "pt_250", "pt_251", "pt_252", "pt_253", "pt_254", "pt_255", "pt_256", "pt_257", "pt_258", "pt_259", "pt_260", "pt_261", "pt_262", "pt_263", "pt_264", "pt_265", "pt_266", "pt_267", "pt_268", "pt_269", "pt_270", "pt_271", "pt_272", "pt_273", "pt_274", "pt_275", "pt_276", "pt_277", "pt_278", "pt_279", "pt_280", "pt_281", "pt_282", "pt_283", "pt_284", "pt_285", "pt_286", "pt_287", "pt_288", "pt_289", "pt_290", "pt_291", "pt_292", "pt_293", "pt_294", "pt_295", "pt_296", "pt_297", "pt_298", "pt_299", "pt_300", "pt_301", "pt_302", "pt_303", "pt_304", "pt_305", "pt_306", "pt_307", "pt_308", "pt_309", "pt_310", "pt_311", "pt_312", "pt_313", "pt_314", "pt_315", "pt_316", "pt_317", "pt_318", "pt_319", "pt_320", "pt_321", "pt_322", "pt_323", "pt_324", "pt_325", "pt_326", "pt_327", "pt_328", "pt_329", "pt_330", "pt_331", "pt_332", "pt_333", "pt_334", "pt_335", "pt_336", "pt_337", "pt_338", "pt_339", "pt_340"]};
    const hasCheckpoints = true;

    const form = document.getElementById("inference-form");
    const uploadForm = document.getElementById("upload-form");
    const splitSelect = document.getElementById("split-select");
    const patientSelect = document.getElementById("patient-select");
    const checkpointSelect = document.getElementById("checkpoint-select");
    const submitButton = document.getElementById("submit-button");
    const patientGrid = document.getElementById("patient-grid");
    const formError = document.getElementById("form-error");

    const caseZipInput = document.getElementById("case-zip-input");
    const uploadCheckpointSelect = document.getElementById("upload-checkpoint-select");
    const uploadSubmitButton = document.getElementById("upload-submit-button");

    const progressSection = document.getElementById("progress-section");
    const progressTitle = document.getElementById("progress-title");
    const progressPercent = document.getElementById("progress-percent");
    const progressFill = document.getElementById("progress-fill");
    const progressMessage = document.getElementById("progress-message");

    const resultsSection = document.getElementById("results-section");
    const resultLink = document.getElementById("result-link");
    const resultHeader = document.getElementById("result-header");
    const resultStats = document.getElementById("result-stats");

    const slicePanel = document.getElementById("slice-panel");
    const sliceSlider = document.getElementById("slice-slider");
    const sliceLabel = document.getElementById("slice-label");
    const viewerGrid = document.getElementById("viewer-grid");
    const predImage = document.getElementById("pred-image");
    const refFigure = document.getElementById("ref-figure");
    const refImage = document.getElementById("ref-image");

    const dvhPanel = document.getElementById("dvh-panel");
    const dvhControls = document.getElementById("dvh-controls");
    const structureSelect = document.getElementById("structure-select");
    const dvhChartWrap = document.getElementById("dvh-chart-wrap");
    const dvhEmpty = document.getElementById("dvh-empty");
    const dvhCanvas = document.getElementById("dvh-chart");

    const metricPanel = document.getElementById("metric-panel");
    const metricBody = document.getElementById("metric-body");
    const metricEmpty = document.getElementById("metric-empty");

    let isRunning = false;
    let currentJobId = null;
    let pollTimer = null;
    let currentSummary = null;
    let dvhChart = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>\"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      })[char]);
    }

    function basename(path) {
      return String(path || "").split(/[\\/]/).pop() || "";
    }

    function getCaseNumber(split, patientId) {
      const patients = patientsBySplit[split] || [];
      const index = patients.indexOf(patientId);
      return index >= 0 ? index + 1 : null;
    }

    function formatNumber(value, digits = 3) {
      return value === null || value === undefined ? "暂无" : Number(value).toFixed(digits);
    }

    function formatApiError(detail, fallback) {
      if (Array.isArray(detail)) {
        const messages = detail.map((item) => {
          if (item && typeof item === "object") {
            if (item.msg) {
              return item.msg;
            }
            return JSON.stringify(item);
          }
          return String(item);
        }).filter(Boolean);
        return messages.length > 0 ? messages.join("；") : fallback;
      }
      if (detail && typeof detail === "object") {
        if (detail.msg) {
          return detail.msg;
        }
        return JSON.stringify(detail);
      }
      if (detail !== null && detail !== undefined && detail !== "") {
        return String(detail);
      }
      return fallback;
    }

    function showError(message) {
      formError.textContent = message;
      formError.classList.remove("is-hidden");
    }

    function clearError() {
      formError.textContent = "";
      formError.classList.add("is-hidden");
    }

    function setProgress(progress, message, title) {
      progressSection.classList.remove("is-hidden");
      progressTitle.textContent = title || "正在预测";
      progressPercent.textContent = `${progress}%`;
      progressFill.style.width = `${progress}%`;
      progressMessage.textContent = message || "正在处理中";
    }

    function updateSubmitState() {
      const hasPatients = Boolean(patientSelect.value);
      const hasUploadFile = Boolean(caseZipInput.files && caseZipInput.files.length > 0);

      submitButton.disabled = isRunning || !hasCheckpoints || !hasPatients;
      submitButton.textContent = isRunning ? "处理中..." : "开始预测";
      splitSelect.disabled = isRunning;
      patientSelect.disabled = isRunning;
      checkpointSelect.disabled = isRunning || !hasCheckpoints;

      uploadSubmitButton.disabled = isRunning || !hasCheckpoints || !hasUploadFile;
      uploadSubmitButton.textContent = isRunning ? "处理中..." : "上传并预测";
      caseZipInput.disabled = isRunning;
      uploadCheckpointSelect.disabled = isRunning || !hasCheckpoints;
    }

    function refreshPatients() {
      const split = splitSelect.value;
      const patients = patientsBySplit[split] || [];
      patientSelect.innerHTML = "";
      patientGrid.innerHTML = "";

      if (patients.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "暂无病例";
        patientSelect.appendChild(option);
      } else {
        for (const [index, id] of patients.entries()) {
          const caseNumber = index + 1;
          const option = document.createElement("option");
          option.value = id;
          option.textContent = `${caseNumber}`;
          patientSelect.appendChild(option);

          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip";
          button.textContent = `${caseNumber}`;
          button.title = id;
          button.addEventListener("click", () => {
            if (isRunning) {
              return;
            }
            patientSelect.value = id;
            updateSubmitState();
          });
          patientGrid.appendChild(button);
        }
      }
      updateSubmitState();
    }

    function resetPendingUi(title, message) {
      window.clearTimeout(pollTimer);
      currentJobId = null;
      currentSummary = null;
      resultsSection.classList.add("is-hidden");
      setProgress(0, message, title);
    }

    function slicePath(prefix, idx) {
      return `/outputs/web/${currentSummary.result_name}/slices/${prefix}_${String(idx).padStart(3, "0")}.png`;
    }

    function updateSliceViewer() {
      if (!currentSummary) {
        return;
      }
      const idx = Number(sliceSlider.value);
      sliceLabel.textContent = `第 ${idx + 1} 张 / 共 ${currentSummary.slice_count} 张`;
      predImage.src = slicePath("pred", idx);
      if (currentSummary.has_reference_dose) {
        refImage.src = slicePath("ref", idx);
      }
    }

    function ensureChart() {
      if (dvhChart) {
        return dvhChart;
      }
      dvhChart = new Chart(dvhCanvas.getContext("2d"), {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "预测值",
              data: [],
              borderColor: "#1f77b4",
              borderWidth: 2,
              pointRadius: 0,
              fill: false,
            },
            {
              label: "参考值",
              data: [],
              borderColor: "#d62728",
              borderWidth: 2,
              borderDash: [8, 4],
              pointRadius: 0,
              fill: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              title: { display: true, text: "剂量 (Gy)" },
            },
            y: {
              title: { display: true, text: "体积 (%)" },
              min: 0,
              max: 100,
            },
          },
        },
      });
      return dvhChart;
    }

    function updateDvhChart(structureName) {
      if (!currentSummary) {
        return;
      }
      const payload = (currentSummary.dvh_curves || {})[structureName] || {};
      const pred = payload.pred || { dose: [], volume: [] };
      const ref = payload.ref || { dose: [], volume: [] };
      const chart = ensureChart();
      chart.data.labels = pred.dose.length ? pred.dose : ref.dose;
      chart.data.datasets[0].data = pred.volume || [];
      chart.data.datasets[1].data = ref.volume || [];
      chart.data.datasets[1].hidden = !ref.dose || ref.dose.length === 0;
      chart.update();
    }

    function renderDvh(summary) {
      const curves = summary.dvh_curves || {};
      const structures = Object.keys(curves);
      dvhPanel.classList.remove("is-hidden");
      if (structures.length === 0) {
        dvhControls.classList.add("is-hidden");
        dvhChartWrap.classList.add("is-hidden");
        dvhEmpty.classList.remove("is-hidden");
        return;
      }
      dvhControls.classList.remove("is-hidden");
      dvhChartWrap.classList.remove("is-hidden");
      dvhEmpty.classList.add("is-hidden");
      structureSelect.innerHTML = "";
      for (const name of structures) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        structureSelect.appendChild(option);
      }
      structureSelect.value = structures[0];
      updateDvhChart(structures[0]);
    }

    function renderMetrics(summary) {
      const rows = summary.metric_rows || [];
      metricPanel.classList.remove("is-hidden");
      if (rows.length === 0) {
        metricBody.innerHTML = "";
        metricEmpty.classList.remove("is-hidden");
        return;
      }
      metricEmpty.classList.add("is-hidden");
      metricBody.innerHTML = rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.structure)}</td>
          <td>${escapeHtml(row.metric)}</td>
          <td>${formatNumber(row.pred)}</td>
          <td>${formatNumber(row.ref)}</td>
          <td>${formatNumber(row.abs_diff)}</td>
        </tr>
      `).join("");
    }

    function renderResult(summary, resultUrl) {
      currentSummary = summary;
      resultsSection.classList.remove("is-hidden");
      resultLink.href = resultUrl || `/result/${summary.result_name}`;
      resultLink.classList.remove("is-hidden");

      const splitLabel = summary.split_label || splitLabels[summary.split] || summary.split;
      const caseNumber = getCaseNumber(summary.split, summary.patient_id);
      let caseTitle = "";
      if (summary.source_type === "upload" || summary.split === "upload") {
        caseTitle = `导入病例：${escapeHtml(summary.display_name || summary.patient_id)}`;
      } else if (caseNumber !== null) {
        caseTitle = `病例 ${caseNumber}`;
      } else {
        caseTitle = `病例 ${escapeHtml(summary.display_name || summary.patient_id)}`;
      }
      const checkpointName = summary.checkpoint_name || basename(summary.checkpoint_path);
      resultHeader.innerHTML = `
        <div class="result-heading">
          <div>
            <h3>${caseTitle}</h3>
            <p class="hint">数据划分：${escapeHtml(splitLabel)}</p>
          </div>
          <p class="muted-line">模型检查点：<code>${escapeHtml(checkpointName)}</code></p>
        </div>
      `;

      resultStats.innerHTML = `
        <div class="stat"><span>Dose score</span><strong>${formatNumber(summary.dose_score, 4)}</strong></div>
        <div class="stat"><span>DVH score</span><strong>${formatNumber(summary.dvh_score, 4)}</strong></div>
        <div class="stat"><span>切片数</span><strong>${summary.slice_count}</strong></div>
        <div class="stat"><span>参考剂量</span><strong>${summary.has_reference_dose ? "有" : "无"}</strong></div>
      `;

      slicePanel.classList.remove("is-hidden");
      viewerGrid.classList.toggle("single", !summary.has_reference_dose);
      refFigure.classList.toggle("is-hidden", !summary.has_reference_dose);
      sliceSlider.min = 0;
      sliceSlider.max = Math.max(summary.slice_count - 1, 0);
      sliceSlider.value = Math.floor(summary.slice_count / 2);
      updateSliceViewer();

      renderDvh(summary);
      renderMetrics(summary);
      resultsSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function pollJob() {
      if (!currentJobId) {
        return;
      }
      try {
        const response = await fetch(`/api/jobs/${currentJobId}`, { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(formatApiError(payload.detail, "获取任务进度失败"));
        }

        const statusTitle = {
          queued: "排队中",
          running: "正在预测",
          completed: "预测完成",
          failed: "预测失败",
        }[payload.status] || "正在处理";
        setProgress(payload.progress ?? 0, payload.message || "正在处理", statusTitle);

        if (payload.status === "completed") {
          currentJobId = null;
          isRunning = false;
          updateSubmitState();
          renderResult(payload.summary, payload.result_url);
          return;
        }

        if (payload.status === "failed") {
          currentJobId = null;
          isRunning = false;
          updateSubmitState();
          showError(payload.error || payload.message || "预测失败");
          return;
        }
      } catch (error) {
        currentJobId = null;
        isRunning = false;
        updateSubmitState();
        showError(error.message || "获取任务进度失败");
        return;
      }

      pollTimer = window.setTimeout(pollJob, 800);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      if (!patientSelect.value) {
        showError("当前数据划分没有可用病例。");
        return;
      }
      if (!checkpointSelect.value) {
        showError("请选择可用的模型检查点。");
        return;
      }

      resetPendingUi("正在创建任务", "正在提交任务");
      const formData = new FormData(form);

      isRunning = true;
      updateSubmitState();

      try {
        const response = await fetch("/api/run-inference", {
          method: "POST",
          body: formData,
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(formatApiError(payload.detail, "任务提交失败"));
        }
        currentJobId = payload.job_id;
        setProgress(0, "任务已提交，正在等待执行", "任务已创建");
        pollJob();
      } catch (error) {
        isRunning = false;
        updateSubmitState();
        showError(error.message || "任务提交失败");
      }
    });

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      if (!caseZipInput.files || caseZipInput.files.length === 0) {
        showError("请选择一个 zip 病例压缩包。");
        return;
      }
      if (!uploadCheckpointSelect.value) {
        showError("请选择可用的模型检查点。");
        return;
      }

      const uploadName = caseZipInput.files[0].name;
      resetPendingUi("正在上传病例包", `正在上传 ${uploadName}`);
      const formData = new FormData(uploadForm);

      isRunning = true;
      updateSubmitState();

      try {
        const response = await fetch("/api/run-upload-inference", {
          method: "POST",
          body: formData,
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(formatApiError(payload.detail, "上传任务提交失败"));
        }
        currentJobId = payload.job_id;
        setProgress(0, "病例包已上传，正在等待执行", "任务已创建");
        pollJob();
      } catch (error) {
        isRunning = false;
        updateSubmitState();
        showError(error.message || "上传任务提交失败");
      }
    });

    splitSelect.addEventListener("change", refreshPatients);
    patientSelect.addEventListener("change", updateSubmitState);
    caseZipInput.addEventListener("change", updateSubmitState);
    structureSelect.addEventListener("change", () => updateDvhChart(structureSelect.value));
    sliceSlider.addEventListener("input", updateSliceViewer);

    refreshPatients();
  </script>
</body>
</html>
